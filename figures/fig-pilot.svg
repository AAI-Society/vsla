<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" height="560" role="img" aria-label="Three pilot arms, paired improvement and safety metrics, and two settings with their guardrails" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#0A0A0A"><title>Pilot design</title><defs><linearGradient id="gv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3A3833"/><stop offset="1" stop-color="#0A0A0A"/></linearGradient><linearGradient id="gt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7A9900"/><stop offset="1" stop-color="#566B00"/></linearGradient><linearGradient id="gaccent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#CFFF04"/><stop offset="1" stop-color="#CFFF04"/></linearGradient><linearGradient id="gpaper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#FBFAF7"/></linearGradient><radialGradient id="gglow" cx="0.08" cy="0" r="0.9"><stop offset="0" stop-color="#F0EDEA" stop-opacity="0.9"/><stop offset="0.45" stop-color="#F0EDEA" stop-opacity="0"/></radialGradient><linearGradient id="glvl0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#EEEBE6"/></linearGradient><linearGradient id="glvl1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#F2FFB8"/></linearGradient><linearGradient id="glvl2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#E3EDC2"/></linearGradient><linearGradient id="glvl3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#DDD9D2"/></linearGradient></defs><rect x="1" y="1" width="1038" height="558" rx="22" fill="url(#gpaper)" stroke="#E7E3DD" stroke-width="2"/><rect x="1" y="1" width="1038" height="558" rx="22" fill="url(#gglow)"/><text x="44.0" y="56.0" font-size="27" fill="#0A0A0A" font-weight="600" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">Pilots: one hypothesis, paired metrics, three arms</text><rect x="44" y="66" width="64" height="3.5" rx="1.75" fill="url(#gaccent)"/><text x="44.0" y="92.0" font-size="14" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">Does a verified Patch L2 statement get a machine patch accepted more often, and no less safely, than an identical unattested one?</text><rect x="44.0" y="122.0" width="300.0" height="86.0" rx="14" fill="#EEEBE6" stroke="none" stroke-width="1.5"/><text x="60.0" y="146.0" font-size="10.5" fill="#5F5A52" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" letter-spacing="1.6">ARM 1 · UNATTESTED</text><text x="60.0" y="170.0" font-size="12" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">the partner's existing stream of machine</text><text x="60.0" y="185.0" font-size="12" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">patches</text><rect x="368.0" y="122.0" width="300.0" height="86.0" rx="14" fill="#E3EDC2" stroke="none" stroke-width="1.5"/><text x="384.0" y="146.0" font-size="10.5" fill="#7A9900" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" letter-spacing="1.6">ARM 2 · ATTESTED</text><text x="384.0" y="170.0" font-size="12" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">the same pipeline, Patch L2 statement</text><text x="384.0" y="185.0" font-size="12" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">attached</text><rect x="692.0" y="122.0" width="300.0" height="86.0" rx="14" fill="#DDD9D2" stroke="none" stroke-width="1.5"/><text x="708.0" y="146.0" font-size="10.5" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" letter-spacing="1.6">ARM 3 · WITHHELD</text><text x="708.0" y="170.0" font-size="12" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">the same pipeline, statement produced</text><text x="708.0" y="185.0" font-size="12" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">but not shown</text><text x="44.0" y="240.0" font-size="11.5" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">arm 3 separates the badge from the pipeline behind it</text><rect x="44.0" y="268.0" width="480.0" height="150.0" rx="14" fill="#0A0A0A" opacity="0.045"/><rect x="44.0" y="264.0" width="480.0" height="150.0" rx="14" fill="#0A0A0A" opacity="0.05"/><rect x="44.0" y="262.0" width="480.0" height="150.0" rx="14" fill="#fff" stroke="#7A9900" stroke-width="2"/><text x="64.0" y="288.0" font-size="10.5" fill="#566B00" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" letter-spacing="1.6">WHAT WE HOPE IMPROVES</text><circle cx="72" cy="316" r="6" fill="#566B00"/><path d="M68.2 316l2.8 2.8l5.2-5.6" stroke="#fff" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="90.0" y="320.0" font-size="12.5" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">acceptance rate vs. the partner's baseline</text><circle cx="72" cy="342" r="6" fill="#566B00"/><path d="M68.2 342l2.8 2.8l5.2-5.6" stroke="#fff" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="90.0" y="346.0" font-size="12.5" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">time-to-merge</text><circle cx="72" cy="368" r="6" fill="#566B00"/><path d="M68.2 368l2.8 2.8l5.2-5.6" stroke="#fff" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="90.0" y="372.0" font-size="12.5" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">maintainer minutes per case, per level</text><rect x="556.0" y="268.0" width="440.0" height="150.0" rx="14" fill="#0A0A0A" opacity="0.045"/><rect x="556.0" y="264.0" width="440.0" height="150.0" rx="14" fill="#0A0A0A" opacity="0.05"/><rect x="556.0" y="262.0" width="440.0" height="150.0" rx="14" fill="#fff" stroke="#D43F45" stroke-width="2"/><text x="576.0" y="288.0" font-size="10.5" fill="#D43F45" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" letter-spacing="1.6">WHAT MUST NOT GET WORSE</text><rect x="578" y="310" width="12" height="12" rx="3" fill="#D43F45"/><text x="600.0" y="320.0" font-size="12.5" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">post-merge revert and regression rate</text><rect x="578" y="336" width="12" height="12" rx="3" fill="#D43F45"/><text x="600.0" y="346.0" font-size="12.5" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">defects found in attested patches by later review</text><rect x="578" y="362" width="12" height="12" rx="3" fill="#D43F45"/><text x="600.0" y="372.0" font-size="12.5" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">false acceptance on a seeded adversarial set</text><circle cx="540" cy="337" r="13" fill="#fff" stroke="#E7E3DD" stroke-width="1.5"/><text x="540.0" y="342.0" font-size="14" fill="#3A3833" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">&amp;</text><rect x="44.0" y="436.0" width="480.0" height="84.0" rx="12" fill="#F0EDEA" stroke="none" stroke-width="1.5"/><text x="60.0" y="460.0" font-size="14" fill="#0A0A0A" font-weight="600" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">Partner-hosted</text><text x="60.0" y="480.0" font-size="11" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">an established project pins the intake as its authoritative</text><text x="60.0" y="494.0" font-size="11" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">channel and receives attested patches on already-triaged bugs</text><rect x="556.0" y="436.0" width="440.0" height="84.0" rx="12" fill="#F0EDEA" stroke="none" stroke-width="1.5"/><text x="572.0" y="460.0" font-size="14" fill="#0A0A0A" font-weight="600" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">Staging (private fork)</text><text x="572.0" y="480.0" font-size="11" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">the hunter runs on self-hosted weights against a private</text><text x="572.0" y="494.0" font-size="11" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">fork; each upstream is notified at discovery through its</text><text x="572.0" y="508.0" font-size="11" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">declared channel; no public hardened fork</text><text x="520.0" y="538.0" font-size="12.5" fill="#6F6A62" font-weight="400" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">Guardrails: authorised targets only, the authorization basis in every statement, the whole pipeline on self-hosted weights, results published in aggregate.</text></svg>
