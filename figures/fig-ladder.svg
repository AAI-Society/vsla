<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" width="1040" height="660" role="img" aria-label="Four VSLA levels drawn as a staircase from L0 Unattested to L3 Hardened, each step listing the requirements it adds" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#0A0A0A"><title>The VSLA ladder</title><defs><linearGradient id="gv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3A3833"/><stop offset="1" stop-color="#0A0A0A"/></linearGradient><linearGradient id="gt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7A9900"/><stop offset="1" stop-color="#566B00"/></linearGradient><linearGradient id="gaccent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#CFFF04"/><stop offset="1" stop-color="#CFFF04"/></linearGradient><linearGradient id="gpaper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#FBFAF7"/></linearGradient><radialGradient id="gglow" cx="0.08" cy="0" r="0.9"><stop offset="0" stop-color="#F0EDEA" stop-opacity="0.9"/><stop offset="0.45" stop-color="#F0EDEA" stop-opacity="0"/></radialGradient><linearGradient id="glvl0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#EEEBE6"/></linearGradient><linearGradient id="glvl1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#F2FFB8"/></linearGradient><linearGradient id="glvl2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#E3EDC2"/></linearGradient><linearGradient id="glvl3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#DDD9D2"/></linearGradient></defs><rect x="1" y="1" width="1038" height="658" rx="22" fill="url(#gpaper)" stroke="#E7E3DD" stroke-width="2"/><rect x="1" y="1" width="1038" height="658" rx="22" fill="url(#gglow)"/><text x="44.0" y="56.0" font-size="27" fill="#0A0A0A" font-weight="600" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">The VSLA ladder</text><rect x="44" y="66" width="64" height="3.5" rx="1.75" fill="url(#gaccent)"/><text x="44.0" y="92.0" font-size="14" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">Each level is a floor: every requirement of the levels below it, plus its own. A verifier recomputes the level; it never takes the claim.</text><rect x="44.0" y="407.0" width="232.0" height="200.0" rx="18" fill="#0A0A0A" opacity="0.045"/><rect x="44.0" y="402.5" width="232.0" height="200.0" rx="18" fill="#0A0A0A" opacity="0.05"/><rect x="44.0" y="400.0" width="232.0" height="200.0" rx="18" fill="url(#glvl0)" stroke="#8F8A82" stroke-width="2"/><rect x="44" y="400" width="232" height="8" rx="4" fill="#8F8A82"/><text x="62.0" y="448.0" font-size="32" fill="#5F5A52" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">L0</text><text x="120.0" y="448.0" font-size="21" fill="#0A0A0A" font-weight="600" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">Unattested</text><text x="62.0" y="472.0" font-size="9.5" fill="#5F5A52" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" letter-spacing="1.6">NO STATEMENT</text><text x="62.0" y="496.0" font-size="12.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">No statement: an email, an</text><text x="62.0" y="512.5" font-size="12.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">issue, a scanner dump, a</text><text x="62.0" y="529.0" font-size="12.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">human researcher's report.</text><text x="62.0" y="545.5" font-size="12.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">Trust is whoever sent it.</text><text x="62.0" y="580.0" font-size="11.5" fill="#5F5A52" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">buys nothing new</text><circle cx="280" cy="386" r="11" fill="#fff" stroke="#CFFF04" stroke-width="2"/><text x="280.0" y="390.5" font-size="15" fill="#566B00" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">+</text><rect x="284.0" y="363.0" width="232.0" height="244.0" rx="18" fill="#0A0A0A" opacity="0.045"/><rect x="284.0" y="358.5" width="232.0" height="244.0" rx="18" fill="#0A0A0A" opacity="0.05"/><rect x="284.0" y="356.0" width="232.0" height="244.0" rx="18" fill="url(#glvl1)" stroke="#CFFF04" stroke-width="2"/><rect x="284" y="356" width="232" height="8" rx="4" fill="#CFFF04"/><text x="302.0" y="404.0" font-size="32" fill="#566B00" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">L1</text><text x="360.0" y="404.0" font-size="21" fill="#0A0A0A" font-weight="600" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">Attested</text><text x="302.0" y="428.0" font-size="9.5" fill="#566B00" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" letter-spacing="1.6">THE FINDER SIGNED IT</text><text x="302.0" y="452.0" font-size="12.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">Signed, complete account:</text><text x="302.0" y="468.5" font-size="12.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">subject bound to the commit,</text><text x="302.0" y="485.0" font-size="12.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">authorization basis, MBOM,</text><text x="302.0" y="501.5" font-size="12.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">Merkle-rooted transcript,</text><text x="302.0" y="518.0" font-size="12.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">a test executed by code that</text><text x="302.0" y="534.5" font-size="12.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">fails by assertion.</text><text x="302.0" y="580.0" font-size="11.5" fill="#566B00" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">reproducible, not yet real</text><circle cx="520" cy="286" r="11" fill="#fff" stroke="#566B00" stroke-width="2"/><text x="520.0" y="290.5" font-size="15" fill="#3F5000" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">+</text><rect x="524.0" y="263.0" width="232.0" height="344.0" rx="18" fill="#0A0A0A" opacity="0.045"/><rect x="524.0" y="258.5" width="232.0" height="344.0" rx="18" fill="#0A0A0A" opacity="0.05"/><rect x="524.0" y="256.0" width="232.0" height="344.0" rx="18" fill="url(#glvl2)" stroke="#566B00" stroke-width="2"/><rect x="524" y="256" width="232" height="8" rx="4" fill="#566B00"/><text x="542.0" y="304.0" font-size="32" fill="#3F5000" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">L2</text><text x="600.0" y="304.0" font-size="21" fill="#0A0A0A" font-weight="600" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">Trusted</text><text x="542.0" y="328.0" font-size="9.5" fill="#3F5000" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" letter-spacing="1.6">A PLATFORM RE-CHECKED IT</text><text x="542.0" y="352.0" font-size="12.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">+ The platform re-ran the test</text><text x="542.0" y="368.5" font-size="12.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">at the subject revision with its</text><text x="542.0" y="385.0" font-size="12.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">own classifier and coverage check,</text><text x="542.0" y="401.5" font-size="12.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">signed a receipt; the finder's</text><text x="542.0" y="418.0" font-size="12.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">ledger verified against pinned</text><text x="542.0" y="434.5" font-size="12.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">countersigners, floors and age.</text><text x="542.0" y="580.0" font-size="11.5" fill="#3F5000" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">somebody else reproduced it</text><circle cx="760" cy="186" r="11" fill="#fff" stroke="#0A0A0A" stroke-width="2"/><text x="760.0" y="190.5" font-size="15" fill="#0A0A0A" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">+</text><rect x="764.0" y="163.0" width="232.0" height="444.0" rx="18" fill="#0A0A0A" opacity="0.045"/><rect x="764.0" y="158.5" width="232.0" height="444.0" rx="18" fill="#0A0A0A" opacity="0.05"/><rect x="764.0" y="156.0" width="232.0" height="444.0" rx="18" fill="url(#glvl3)" stroke="#0A0A0A" stroke-width="2"/><rect x="764" y="156" width="232" height="8" rx="4" fill="#0A0A0A"/><text x="782.0" y="204.0" font-size="32" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">L3</text><text x="840.0" y="204.0" font-size="21" fill="#0A0A0A" font-weight="600" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">Hardened</text><text x="782.0" y="228.0" font-size="9.5" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" letter-spacing="1.6">A MEASURED RUN SIGNED IT</text><text x="782.0" y="252.0" font-size="12.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">+ Weights, harness, policy and</text><text x="782.0" y="268.5" font-size="12.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">sandbox in an attested environment;</text><text x="782.0" y="285.0" font-size="12.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">the quote binds them and the</text><text x="782.0" y="301.5" font-size="12.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">signing key; the measurement is</text><text x="782.0" y="318.0" font-size="12.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">on the verifier's allowlist.</text><text x="782.0" y="334.5" font-size="12.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">Any api-served model caps it at L2.</text><text x="782.0" y="580.0" font-size="11.5" fill="#0A0A0A" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">attributable to a measured run</text><text x="520.0" y="638.0" font-size="12.5" fill="#6F6A62" font-weight="400" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">Three pillars are judged at every level and the weakest pillar sets the level; a claimed L3 with no ledger verifies at L1.</text></svg>
