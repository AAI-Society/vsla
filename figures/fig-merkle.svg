ize="10" fill="#fff" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">h5</text><circle cx="808" cy="508" r="15" fill="#0A0A0A" opacity="0.08"/><circle cx="808" cy="506" r="15" fill="#7A9900" stroke="#fff" stroke-width="2.5"/><text x="808.0" y="510.5" font-size="10" fill="#fff" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">h6</text><circle cx="926" cy="508" r="15" fill="#0A0A0A" opacity="0.08"/><circle cx="926" cy="506" r="15" fill="#7A9900" stroke="#fff" stroke-width="2.5"/><text x="926.0" y="510.5" font-size="10" fill="#fff" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">h7</text><circle cx="159.0" cy="418" r="15" fill="#0A0A0A" opacity="0.08"/><circle cx="159.0" cy="416" r="15" fill="#7A9900" stroke="#fff" stroke-width="2.5"/><text x="159.0" y="420.5" font-size="10" fill="#fff" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">h10</text><circle cx="395.0" cy="418" r="15" fill="#0A0A0A" opacity="0.08"/><circle cx="395.0" cy="416" r="15" fill="#7A9900" stroke="#fff" stroke-width="2.5"/><text x="395.0" y="420.5" font-size="10" fill="#fff" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">h11</text><circle cx="631.0" cy="418" r="15" fill="#0A0A0A" opacity="0.08"/><circle cx="631.0" cy="416" r="15" fill="#D43F45" stroke="#fff" stroke-width="2.5"/><text x="631.0" y="420.5" font-size="10" fill="#fff" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">h12</text><circle cx="867.0" cy="418" r="15" fill="#0A0A0A" opacity="0.08"/><circle cx="867.0" cy="416" r="15" fill="#7A9900" stroke="#fff" stroke-width="2.5"/><text x="867.0" y="420.5" font-size="10" fill="#fff" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">h13</text><circle cx="277.0" cy="328" r="15" fill="#0A0A0A" opacity="0.08"/><circle cx="277.0" cy="326" r="15" fill="#7A9900" stroke="#fff" stroke-width="2.5"/><text x="277.0" y="330.5" font-size="10" fill="#fff" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">h20</text><circle cx="749.0" cy="328" r="15" fill="#0A0A0A" opacity="0.08"/><circle cx="749.0" cy="326" r="15" fill="#D43F45" stroke="#fff" stroke-width="2.5"/><text x="749.0" y="330.5" font-size="10" fill="#fff" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">h21</text><circle cx="513.0" cy="238" r="21" fill="#0A0A0A" opacity="0.08"/><circle cx="513.0" cy="236" r="21" fill="#D43F45" stroke="#fff" stroke-width="2.5"/><text x="513.0" y="240.5" font-size="11" fill="#fff" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">root</text><rect x="48.0" y="550.0" width="104.0" height="58.0" rx="10" fill="#E3EDC2" stroke="#7A9900" stroke-width="2"/><text x="100.0" y="572.0" font-size="11" fill="#566B00" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">measure</text><text x="100.0" y="591.0" font-size="11.5" fill="#0A0A0A" font-weight="600" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">harness ‖ sandbox</text><text x="100.0" y="624.0" font-size="10" fill="#6F6A62" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">leaf 0</text><rect x="166.0" y="550.0" width="104.0" height="58.0" rx="10" fill="#F0EDEA" stroke="none" stroke-width="2"/><text x="218.0" y="572.0" font-size="11" fill="#6F6A62" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">turn</text><text x="218.0" y="591.0" font-size="11.5" fill="#0A0A0A" font-weight="600" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">hunter</text><text x="218.0" y="624.0" font-size="10" fill="#6F6A62" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">leaf 1</text><rect x="284.0" y="550.0" width="104.0" height="58.0" rx="10" fill="#F0EDEA" stroke="none" stroke-width="2"/><text x="336.0" y="572.0" font-size="11" fill="#6F6A62" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">tool</text><text x="336.0" y="591.0" font-size="11.5" fill="#0A0A0A" font-weight="600" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">read files.py</text><text x="336.0" y="624.0" font-size="10" fill="#6F6A62" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">leaf 2</text><rect x="402.0" y="550.0" width="104.0" height="58.0" rx="10" fill="#F0EDEA" stroke="none" stroke-width="2"/><text x="454.0" y="572.0" font-size="11" fill="#6F6A62" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">tool</text><text x="454.0" y="591.0" font-size="11.5" fill="#0A0A0A" font-weight="600" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">write test</text><text x="454.0" y="624.0" font-size="10" fill="#6F6A62" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">leaf 3</text><rect x="520.0" y="550.0" width="104.0" height="58.0" rx="10" fill="#FFE3E4" stroke="#D43F45" stroke-width="2"/><text x="572.0" y="572.0" font-size="11" fill="#6F6A62" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">tool</text><text x="572.0" y="591.0" font-size="11.5" fill="#0A0A0A" font-weight="600" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">run pytest</text><text x="572.0" y="624.0" font-size="10" fill="#6F6A62" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">leaf 4</text><rect x="638.0" y="550.0" width="104.0" height="58.0" rx="10" fill="#F0EDEA" stroke="none" stroke-width="2"/><text x="690.0" y="572.0" font-size="11" fill="#6F6A62" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">turn</text><text x="690.0" y="591.0" font-size="11.5" fill="#0A0A0A" font-weight="600" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">reproducer</text><text x="690.0" y="624.0" font-size="10" fill="#6F6A62" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">leaf 5</text><rect x="756.0" y="550.0" width="104.0" height="58.0" rx="10" fill="#E3EDC2" stroke="#7A9900" stroke-width="2"/><text x="808.0" y="572.0" font-size="11" fill="#566B00" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">verify</text><text x="808.0" y="591.0" font-size="11.5" fill="#0A0A0A" font-weight="600" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">exit 1 · assert</text><text x="808.0" y="624.0" font-size="10" fill="#6F6A62" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">leaf 6</text><rect x="874.0" y="550.0" width="104.0" height="58.0" rx="10" fill="#F0EDEA" stroke="none" stroke-width="2"/><text x="926.0" y="572.0" font-size="11" fill="#6F6A62" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">turn</text><text x="926.0" y="591.0" font-size="11.5" fill="#0A0A0A" font-weight="600" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">patcher</text><text x="926.0" y="624.0" font-size="10" fill="#6F6A62" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">leaf 7</text><text x="572.0" y="644.0" font-size="11.5" fill="#D43F45" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">edited after signing</text><text x="100.0" y="644.0" font-size="11" fill="#566B00" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">must be leaf 0</text><text x="808.0" y="644.0" font-size="11" fill="#566B00" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">must agree with reproduction</text><path d="M537.0 236.0L593.0 236.0" stroke="#0A0A0A" stroke-width="2.2" fill="none" stroke-linecap="round" marker-end="url(#arr0A0A0A)"/><rect x="597.0" y="208.0" width="340.0" height="84.0" rx="12" fill="#0A0A0A" opacity="0.045"/><rect x="597.0" y="204.0" width="340.0" height="84.0" rx="12" fill="#0A0A0A" opacity="0.05"/><rect x="597.0" y="202.0" width="340.0" height="84.0" rx="12" fill="#fff" stroke="#0A0A0A" stroke-width="2"/><text x="613.0" y="225.0" font-size="11.5" fill="#0A0A0A" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">transcript.root is a field of the signed statement</text><text x="613.0" y="244.0" font-size="11" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">signed once; anyone with the leaves recomputes it</text><text x="613.0" y="268.0" font-size="11.5" fill="#D43F45" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">root mismatch → E5 fails → statement rejected</text><text x="44.0" y="136.0" font-size="12" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">Leaves carry digests of each prompt, response and tool call, in order; bodies can be released later or sealed to one party</text><text x="44.0" y="152.0" font-size="12" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">and checked against the root. Omission before signing is invisible to any root: completeness needs a recorder inside a measured harness (L3).</text></svg>
