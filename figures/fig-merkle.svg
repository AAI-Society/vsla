<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700" width="1040" height="700" role="img" aria-label="A binary Merkle tree over eight transcript leaves, with the measure and verify leaves highlighted and one tampered leaf whose path to the root is red" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#0A0A0A"><title>Merkle-rooted transcript</title><defs><marker id="arr0A0A0A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A0A0A"/></marker><linearGradient id="gv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3A3833"/><stop offset="1" stop-color="#0A0A0A"/></linearGradient><linearGradient id="gt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7A9900"/><stop offset="1" stop-color="#566B00"/></linearGradient><linearGradient id="gaccent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#CFFF04"/><stop offset="1" stop-color="#CFFF04"/></linearGradient><linearGradient id="gpaper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#FBFAF7"/></linearGradient><radialGradient id="gglow" cx="0.08" cy="0" r="0.9"><stop offset="0" stop-color="#F0EDEA" stop-opacity="0.9"/><stop offset="0.45" stop-color="#F0EDEA" stop-opacity="0"/></radialGradient><linearGradient id="glvl0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#EEEBE6"/></linearGradient><linearGradient id="glvl1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#F2FFB8"/></linearGradient><linearGradient id="glvl2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#E3EDC2"/></linearGradient><linearGradient id="glvl3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#DDD9D2"/></linearGradient></defs><rect x="1" y="1" width="1038" height="698" rx="22" fill="url(#gpaper)" stroke="#E7E3DD" stroke-width="2"/><rect x="1" y="1" width="1038" height="698" rx="22" fill="url(#gglow)"/><text x="44.0" y="56.0" font-size="27" fill="#0A0A0A" font-weight="600" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">A Merkle-rooted transcript</text><rect x="44" y="66" width="64" height="3.5" rx="1.75" fill="url(#gaccent)"/><text x="44.0" y="92.0" font-size="14" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">Every model turn and tool call is a leaf; leaf 0 measures the harness and a verify leaf records the test run.</text><text x="44.0" y="110.0" font-size="14" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">One signed root makes the run tamper-evident after commitment; a dropped or edited leaf changes the root.</text><path d="M100 506L159.0 416" stroke="#D5D0C8" stroke-width="2" fill="none"/><path d="M218 506L159.0 416" stroke="#D5D0C8" stroke-width="2" fill="none"/><path d="M336 506L395.0 416" stroke="#D5D0C8" stroke-width="2" fill="none"/><path d="M454 506L395.0 416" stroke="#D5D0C8" stroke-width="2" fill="none"/><path d="M572 506L631.0 416" stroke="#D43F45" stroke-width="3" fill="none"/><path d="M690 506L631.0 416" stroke="#D5D0C8" stroke-width="2" fill="none"/><path d="M808 506L867.0 416" stroke="#D5D0C8" stroke-width="2" fill="none"/><path d="M926 506L867.0 416" stroke="#D5D0C8" stroke-width="2" fill="none"/><path d="M159.0 416L277.0 326" stroke="#D5D0C8" stroke-width="2" fill="none"/><path d="M395.0 416L277.0 326" stroke="#D5D0C8" stroke-width="2" fill="none"/><path d="M631.0 416L749.0 326" stroke="#D43F45" stroke-width="3" fill="none"/><path d="M867.0 416L749.0 326" stroke="#D5D0C8" stroke-width="2" fill="none"/><path d="M277.