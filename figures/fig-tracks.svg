<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" width="1040" height="500" role="img" aria-label="Finding and Patch tracks side by side, each with three level requirements" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#0A0A0A"><title>Two tracks</title><defs><linearGradient id="gv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3A3833"/><stop offset="1" stop-color="#0A0A0A"/></linearGradient><linearGradient id="gt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7A9900"/><stop offset="1" stop-color="#566B00"/></linearGradient><linearGradient id="gaccent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#CFFF04"/><stop offset="1" stop-color="#CFFF04"/></linearGradient><linearGradient id="gpaper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#FBFAF7"/></linearGradient><radialGradient id="gglow" cx="0.08" cy="0" r="0.9"><stop offset="0" stop-color="#F0EDEA" stop-opacity="0.9"/><stop offset="0.45" stop-color="#F0EDEA" stop-opacity="0"/></radialGradient><linearGradient id="glvl0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#EEEBE6"/></linearGradient><linearGradient id="glvl1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#F2FFB8"/></linearGradient><linearGradient id="glvl2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#E3EDC2"/></linearGradient><linearGradient id="glvl3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#DDD9D2"/></linearGradient></defs><rect x="1" y="1" width="1038" height="498" rx="22" fill="url(#gpaper)" stroke="#E7E3DD" stroke-width="2"/><rect x="1" y="1" width="1038" height="498" rx="22" fill="url(#gglow)"/><text x="44.0" y="56.0" font-size="27" fill="#0A0A0A" font-weight="600" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">Two tracks, one scale</text><rect x="44" y="66" width="64" height="3.5" rx="1.75" fill="url(#gaccent)"/><text x="44.0" y="92.0" font-size="14" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">The Finding track attests that a bug is real; the Patch track that a fix is correct. A disclosure carries one of each, joined by the same subject.</text><rect x="44.0" y="122.0" width="476.0" height="318.0" rx="18" fill="#0A0A0A" opacity="0.045"/><rect x="44.0" y="118.0" width="476.0" height="318.0" rx="18" fill="#0A0A0A" opacity="0.05"/><rect x="44.0" y="116.0" width="476.0" height="318.0" rx="18" fill="#fff" stroke="#E7E3DD" stroke-width="1.5"/><rect x="44" y="116" width="476" height="7" rx="3.5" fill="#7A9900"/><text x="66.0" y="158.0" font-size="20" fill="#0A0A0A" font-weight="600" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">Finding track</text><text x="218.4" y="158.0" font-size="13" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">“the bug is real”</text><rect x="66.0" y="186.0" width="29.0" height="22.0" rx="11.0" fill="#CFFF04" stroke="#CFFF04" stroke-width="1.2"/><text x="80.5" y="199.5" font-size="12" fill="#0A0A0A" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">L1</text><text x="114.0" y="201.0" font-size="11.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">a test fails by assertion at the subject revision,</text><text x="114.0" y="216.0" font-size="11.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">executed by code; MBOM; transcript with measure and</text><text x="114.0" y="231.0" font-size="11.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">verify leaves</text><rect x="66.0" y="266.0" width="29.0" height="22.0" rx="11.0" fill="#566B00" stroke="#566B00" stroke-width="1.2"/><text x="80.5" y="279.5" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">L2</text><text x="114.0" y="281.0" font-size="11.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">re-executed, classified and coverage-checked by the</text><text x="114.0" y="296.0" font-size="11.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">platform at the subject revision; receipt; the finder's</text><text x="114.0" y="311.0" font-size="11.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">Finding-track ledger verified against pinned</text><text x="114.0" y="326.0" font-size="11.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">countersigners</text><rect x="66.0" y="346.0" width="29.0" height="22.0" rx="11.0" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="1.2"/><text x="80.5" y="359.5" font-size="12" fill="#CFFF04" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">L3</text><text x="114.0" y="361.0" font-size="11.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">reproduced inside the attested environment; the sandbox</text><text x="114.0" y="376.0" font-size="11.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">digest is bound into the quote</text><rect x="544.0" y="122.0" width="476.0" height="318.0" rx="18" fill="#0A0A0A" opacity="0.045"/><rect x="544.0" y="118.0" width="476.0" height="318.0" rx="18" fill="#0A0A0A" opacity="0.05"/><rect x="544.0" y="116.0" width="476.0" height="318.0" rx="18" fill="#fff" stroke="#E7E3DD" stroke-width="1.5"/><rect x="544" y="116" width="476" height="7" rx="3.5" fill="#0A0A0A"/><text x="566.0" y="158.0" font-size="20" fill="#0A0A0A" font-weight="600" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">Patch track</text><text x="696.8" y="158.0" font-size="13" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">“the fix is correct”</text><rect x="566.0" y="186.0" width="29.0" height="22.0" rx="11.0" fill="#CFFF04" stroke="#CFFF04" stroke-width="1.2"/><text x="580.5" y="199.5" font-size="12" fill="#0A0A0A" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">L1</text><text x="614.0" y="201.0" font-size="11.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">diff applies; the reproduction passes after it; the</text><text x="614.0" y="216.0" font-size="11.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">project suite passes; all executed by code in a clean</text><text x="614.0" y="231.0" font-size="11.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">checkout; files touched and scope in the statement</text><rect x="566.0" y="266.0" width="29.0" height="22.0" rx="11.0" fill="#566B00" stroke="#566B00" stroke-width="1.2"/><text x="580.5" y="279.5" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">L2</text><text x="614.0" y="281.0" font-size="11.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">the platform re-ran all three, reviewed the diff on a</text><text x="614.0" y="296.0" font-size="11.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">model family different from every patcher in the MBOM,</text><text x="614.0" y="311.0" font-size="11.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">and computed a source-only scope; its Patch-track ledger</text><text x="614.0" y="326.0" font-size="11.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">meets the floor</text><rect x="566.0" y="346.0" width="29.0" height="22.0" rx="11.0" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="1.2"/><text x="580.5" y="359.5" font-size="12" fill="#CFFF04" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">L3</text><text x="614.0" y="361.0" font-size="11.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">patch produced and verified inside the attested</text><text x="614.0" y="376.0" font-size="11.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">environment; the reviewer model is in the MBOM and</text><text x="614.0" y="391.0" font-size="11.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">attested too</text><text x="520.0" y="478.0" font-size="12.5" fill="#6F6A62" font-weight="400" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">Ledgers are scored per track and bound to the finder key: precision on findings buys no trust on patches, and no one else's history counts.</text></svg>
