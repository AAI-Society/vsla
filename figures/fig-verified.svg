.2-5.6" stroke="#fff" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="336.0" y="296.0" width="60.0" height="56.0" rx="10" fill="#FFE3E4" stroke="#D43F45" stroke-width="1.6"/><text x="366.0" y="314.0" font-size="11.5" fill="#D43F45" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">N2</text><rect x="349.0" y="320.0" width="25.8" height="18.5" rx="9.25" fill="#fff" stroke="#566B00" stroke-width="1.2"/><text x="361.9" y="330.0" font-size="8.5" fill="#566B00" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">EXT</text><circle cx="366.0" cy="343" r="6" fill="#D43F45"/><path d="M362.6 339.6l6.8 6.8M369.4 339.6l-6.8 6.8" stroke="#fff" stroke-width="2.1" stroke-linecap="round"/><rect x="404.0" y="296.0" width="60.0" height="56.0" rx="10" fill="#FFE3E4" stroke="#D43F45" stroke-width="1.6"/><text x="434.0" y="314.0" font-size="11.5" fill="#D43F45" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">N3</text><rect x="417.0" y="320.0" width="25.8" height="18.5" rx="9.25" fill="#fff" stroke="#566B00" stroke-width="1.2"/><text x="429.9" y="330.0" font-size="8.5" fill="#566B00" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">EXT</text><text x="434.0" y="346.0" font-size="9" fill="#6F6A62" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">skip</text><text x="478.0" y="330.0" font-size="11" fill="#D43F45" font-weight="600" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">N2: no expectation</text><path d="M880.0 200.0L918.0 200.0" stroke="#3A3833" stroke-width="2.2" fill="none" stroke-linecap="round" marker-end="url(#arr3A3833)"/><rect x="924.0" y="188.0" width="33.3" height="26.0" rx="13.0" fill="#CFFF04" stroke="#CFFF04" stroke-width="1.2"/><text x="940.6" y="205.5" font-size="16" fill="#0A0A0A" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">L1</text><text x="924.0" y="244.0" font-size="12" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">verified</text><text x="44.0" y="390.0" font-size="11.6" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">Evidence reaches L2 (the receiver re-executed); Identity stops at L1 (the ledger was not supplied, and a summary is not evidence);</text><text x="44.0" y="405.5" font-size="11.6" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">Environment stops at L1 (no expectation for this harness version). The verified level is the minimum, L1, recorded with every check</text><text x="44.0" y="421.0" font-size="11.6" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">and its kind in the audit log and in the ledger entry; I5 and N3 are not reached once N2 has failed.</text></svg>
