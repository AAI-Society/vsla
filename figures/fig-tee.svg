<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 786" width="1100" height="786" role="img" aria-label="Two Level 3 environment options, a hardware enclave and a two-host split, the api-served cap, and the weight attestation chain" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#0A0A0A"><title>Level 3 environments</title><defs><marker id="arr0A0A0A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A0A0A"/></marker><marker id="arr3A3833" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3A3833"/></marker><marker id="arr7A9900" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7A9900"/></marker><linearGradient id="gv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3A3833"/><stop offset="1" stop-color="#0A0A0A"/></linearGradient><linearGradient id="gt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7A9900"/><stop offset="1" stop-color="#566B00"/></linearGradient><linearGradient id="gaccent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#CFFF04"/><stop offset="1" stop-color="#CFFF04"/></linearGradient><linearGradient id="gpaper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#FBFAF7"/></linearGradient><radialGradient id="gglow" cx="0.08" cy="0" r="0.9"><stop offset="0" stop-color="#F0EDEA" stop-opacity="0.9"/><stop offset="0.45" stop-color="#F0EDEA" stop-opacity="0"/></radialGradient><linearGradient id="glvl0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#EEEBE6"/></linearGradient><linearGradient id="glvl1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#F2FFB8"/></linearGradient><linearGradient id="glvl2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#E3EDC2"/></linearGradient><linearGradient id="glvl3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#DDD9D2"/></linearGradient></defs><rect x="1" y="1" width="1098" height="784" rx="22" fill="url(#gpaper)" stroke="#E7E3DD" stroke-width="2"/><rect x="1" y="1" width="1098" height="784" rx="22" fill="url(#gglow)"/><text x="44.0" y="56.0" font-size="27" fill="#0A0A0A" font-weight="600" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">Level 3: attribution to a measured run</text><rect x="44" y="66" width="64" height="3.5" rx="1.75" fill="url(#gaccent)"/><text x="44.0" y="92.0" font-size="14" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">Two environments satisfy the pillar. They are different trust statements, and the verifier records which one it accepted.</text><text x="44.0" y="110.0" font-size="14" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">Neither proves the harness is honest, the inputs were honest, or the weights behave; the allowlist is where that judgement lives.</text><rect x="44.0" y="134.0" width="500.0" height="426.0" rx="18" fill="#0A0A0A" opacity="0.045"/><rect x="44.0" y="130.0" width="500.0" height="426.0" rx="18" fill="#0A0A0A" opacity="0.05"/><rect x="44.0" y="128.0" width="500.0" height="426.0" rx="18" fill="#fff" stroke="#E7E3DD" stroke-width="1.5"/><text x="64.0" y="160.0" font-size="17" fill="#0A0A0A" font-weight="600" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">A · Hardware TEE</text><rect x="64.0" y="172.0" width="203.1" height="20.5" rx="10.25" fill="#DDD9D2" stroke="#DDD9D2" stroke-width="1.2"/><text x="165.6" y="184.0" font-size="10.5" fill="#0A0A0A" font-weight="600" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">trust statement: not the operator</text><rect x="68.0" y="208.0" width="330.0" height="232.0" rx="14" fill="#EFEDE9" stroke="#0A0A0A" stroke-width="2" stroke-dasharray="7 5"/><text x="84.0" y="230.0" font-size="9.5" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" letter-spacing="1.6">INSIDE THE MEASURED GUEST</text><rect x="84.0" y="244.0" width="298.0" height="30.0" rx="8" fill="#fff" stroke="none" stroke-width="1.5"/><text x="96.0" y="264.0" font-size="12.5" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">weights</text><text x="186.0" y="264.0" font-size="10.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">sha256 of the loaded bytes · provider-attested</text><rect x="84.0" y="282.0" width="298.0" height="30.0" rx="8" fill="#fff" stroke="none" stroke-width="1.5"/><text x="96.0" y="302.0" font-size="12.5" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">harness</text><text x="186.0" y="302.0" font-size="10.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">qudisclose 0.2.0 · c41d…</text><rect x="84.0" y="320.0" width="298.0" height="30.0" rx="8" fill="#fff" stroke="none" stroke-width="1.5"/><text x="96.0" y="340.0" font-size="12.5" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">policy</text><text x="186.0" y="340.0" font-size="10.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">disclosure policy · 77ab…</text><rect x="84.0" y="358.0" width="298.0" height="30.0" rx="8" fill="#fff" stroke="none" stroke-width="1.5"/><text x="96.0" y="378.0" font-size="12.5" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">sandbox</text><text x="186.0" y="378.0" font-size="10.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">reproduction VM image · 5e1a…</text><rect x="84.0" y="396.0" width="298.0" height="30.0" rx="8" fill="#fff" stroke="none" stroke-width="1.5"/><text x="96.0" y="416.0" font-size="12.5" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">signing key</text><text x="186.0" y="416.0" font-size="10.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">generated inside; never exported</text><path d="M400.0 324.0L444.0 324.0" stroke="#0A0A0A" stroke-width="2.5" fill="none" stroke-linecap="round" marker-end="url(#arr0A0A0A)"/><rect x="446.0" y="290.0" width="80.0" height="68.0" rx="12" fill="url(#gv)" stroke="none" stroke-width="1.5"/><text x="486.0" y="318.0" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">quote</text><text x="486.0" y="336.0" font-size="10" fill="#fff" font-weight="400" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" opacity="0.9">vendor root</text><text x="68.0" y="466.0" font-size="11" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">measurement = launch digest of the guest image. The weights are not in it; the bindings</text><text x="68.0" y="481.0" font-size="11" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">travel in REPORT_DATA = SHA-256(enclaveKey ‖ harness ‖ weights ‖ sandbox) through a measured</text><text x="68.0" y="496.0" font-size="11" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">integrity root. The verifier allowlists (type, measurement, harness) and derives the enclave key</text><text x="68.0" y="511.0" font-size="11" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">from the verified quote; it never pins it.</text><rect x="580.0" y="134.0" width="476.0" height="426.0" rx="18" fill="#0A0A0A" opacity="0.045"/><rect x="580.0" y="130.0" width="476.0" height="426.0" rx="18" fill="#0A0A0A" opacity="0.05"/><rect x="580.0" y="128.0" width="476.0" height="426.0" rx="18" fill="#fff" stroke="#E7E3DD" stroke-width="1.5"/><text x="600.0" y="160.0" font-size="17" fill="#0A0A0A" font-weight="600" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">B · Two operators</text><rect x="600.0" y="172.0" width="282.5" height="20.5" rx="10.25" fill="#DDD9D2" stroke="#DDD9D2" stroke-width="1.2"/><text x="741.2" y="184.0" font-size="10.5" fill="#0A0A0A" font-weight="600" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">trust statement: neither of two operators alone</text><rect x="604.0" y="208.0" width="210.0" height="150.0" rx="14" fill="#EFEDE9" stroke="#3A3833" stroke-width="2"/><text x="618.0" y="230.0" font-size="13" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">host 1</text><text x="618.0" y="246.0" font-size="11" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">cloud operator</text><rect x="618.0" y="256.0" width="182.0" height="26.0" rx="7" fill="#fff" stroke="none" stroke-width="1.5"/><text x="626.0" y="274.0" font-size="11" fill="#0A0A0A" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">share1: weights ⊕ noise</text><rect x="618.0" y="288.0" width="182.0" height="26.0" rx="7" fill="#fff" stroke="none" stroke-width="1.5"/><text x="626.0" y="306.0" font-size="11" fill="#0A0A0A" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Merkle log · signed root</text><rect x="618.0" y="320.0" width="182.0" height="26.0" rx="7" fill="#fff" stroke="none" stroke-width="1.5"/><text x="626.0" y="338.0" font-size="11" fill="#0A0A0A" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">2-of-2 co-signature</text><rect x="834.0" y="208.0" width="210.0" height="150.0" rx="14" fill="#EFEDE9" stroke="#3A3833" stroke-width="2"/><text x="848.0" y="230.0" font-size="13" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">host 2</text><text x="848.0" y="246.0" font-size="11" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">the maintainer's machine</text><rect x="848.0" y="256.0" width="182.0" height="26.0" rx="7" fill="#fff" stroke="none" stroke-width="1.5"/><text x="856.0" y="274.0" font-size="11" fill="#0A0A0A" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">share2: weights ⊕ noise</text><rect x="848.0" y="288.0" width="182.0" height="26.0" rx="7" fill="#fff" stroke="none" stroke-width="1.5"/><text x="856.0" y="306.0" font-size="11" fill="#0A0A0A" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Merkle log · signed root</text><rect x="848.0" y="320.0" width="182.0" height="26.0" rx="7" fill="#fff" stroke="none" stroke-width="1.5"/><text x="856.0" y="338.0" font-size="11" fill="#0A0A0A" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">2-of-2 co-signature</text><path d="M814.0 276.0L834.0 276.0" stroke="#3A3833" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arr3A3833)"/><path d="M834.0 296.0L814.0 296.0" stroke="#3A3833" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arr3A3833)"/><text x="818.0" y="382.0" font-size="11" fill="#3A3833" font-weight="400" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">both hosts sign the same manifest; the verifier requires two distinct pinned co-signers</text><text x="604.0" y="410.0" font-size="11" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">No chip vendor in the trust base. The statement needs both parties; one host's tampering is</text><text x="604.0" y="425.0" font-size="11" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">named to a sequence number. This replaces “the operator cannot reach in” with “neither of</text><text x="604.0" y="440.0" font-size="11" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">two operators can reach in alone”, which is a weaker claim than it sounds when both</text><text x="604.0" y="455.0" font-size="11" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">hosts see the same plaintext.</text><rect x="44.0" y="584.0" width="1012.0" height="48.0" rx="12" fill="#FFE3E4" stroke="none" stroke-width="1.5"/><text x="64.0" y="606.0" font-size="12.5" fill="#D43F45" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">An api-served model cannot be measured by anyone but its provider.</text><text x="64.0" y="623.0" font-size="11" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">Any serving: api model in the MBOM stops the Environment pillar at L2, including the patch agents this paper's own deployment runs.</text><rect x="44.0" y="665.0" width="232.0" height="64.0" rx="12" fill="#0A0A0A" opacity="0.045"/><rect x="44.0" y="661.5" width="232.0" height="64.0" rx="12" fill="#0A0A0A" opacity="0.05"/><rect x="44.0" y="660.0" width="232.0" height="64.0" rx="12" fill="#fff" stroke="#7A9900" stroke-width="2"/><text x="58.0" y="686.0" font-size="13" fill="#7A9900" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">model provider</text><text x="58.0" y="706.0" font-size="10.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">signs {model, weights digest} as DSSE</text><path d="M280.0 692.0L302.0 692.0" stroke="#7A9900" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arr7A9900)"/><rect x="306.0" y="665.0" width="232.0" height="64.0" rx="12" fill="#0A0A0A" opacity="0.045"/><rect x="306.0" y="661.5" width="232.0" height="64.0" rx="12" fill="#0A0A0A" opacity="0.05"/><rect x="306.0" y="660.0" width="232.0" height="64.0" rx="12" fill="#fff" stroke="#0A0A0A" stroke-width="2"/><text x="320.0" y="686.0" font-size="13" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">environment</text><text x="320.0" y="706.0" font-size="10.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">hashes the same bytes at load; binds them</text><path d="M542.0 692.0L564.0 692.0" stroke="#0A0A0A" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arr0A0A0A)"/><rect x="568.0" y="665.0" width="232.0" height="64.0" rx="12" fill="#0A0A0A" opacity="0.045"/><rect x="568.0" y="661.5" width="232.0" height="64.0" rx="12" fill="#0A0A0A" opacity="0.05"/><rect x="568.0" y="660.0" width="232.0" height="64.0" rx="12" fill="#fff" stroke="#3A3833" stroke-width="2"/><text x="582.0" y="686.0" font-size="13" fill="#3A3833" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">statement</text><text x="582.0" y="706.0" font-size="10.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">carries quote + provider attestation</text><path d="M804.0 692.0L826.0 692.0" stroke="#3A3833" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arr3A3833)"/><rect x="830.0" y="665.0" width="232.0" height="64.0" rx="12" fill="#0A0A0A" opacity="0.045"/><rect x="830.0" y="661.5" width="232.0" height="64.0" rx="12" fill="#0A0A0A" opacity="0.05"/><rect x="830.0" y="660.0" width="232.0" height="64.0" rx="12" fill="#fff" stroke="#566B00" stroke-width="2"/><text x="844.0" y="686.0" font-size="13" fill="#566B00" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">verifier</text><text x="844.0" y="706.0" font-size="10.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">chain closes under pinned keys, or no L3</text><text x="550.0" y="764.0" font-size="12.5" fill="#6F6A62" font-weight="400" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">The reference verifier ships only the signed-quote adapter, a fixture that proves a pinned root key signed the bindings; hardware adapters are not claimed.</text></svg>
