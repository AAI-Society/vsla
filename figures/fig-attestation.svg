<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="1100" height="800" role="img" aria-label="A VSLA provenance statement with its subject, predicate sections tagged by level, the profile strip, and three signature bands" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#0A0A0A"><title>Anatomy of a VSLA statement</title><defs><linearGradient id="gv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3A3833"/><stop offset="1" stop-color="#0A0A0A"/></linearGradient><linearGradient id="gt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7A9900"/><stop offset="1" stop-color="#566B00"/></linearGradient><linearGradient id="gaccent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#CFFF04"/><stop offset="1" stop-color="#CFFF04"/></linearGradient><linearGradient id="gpaper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#FBFAF7"/></linearGradient><radialGradient id="gglow" cx="0.08" cy="0" r="0.9"><stop offset="0" stop-color="#F0EDEA" stop-opacity="0.9"/><stop offset="0.45" stop-color="#F0EDEA" stop-opacity="0"/></radialGradient><linearGradient id="glvl0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#EEEBE6"/></linearGradient><linearGradient id="glvl1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#F2FFB8"/></linearGradient><linearGradient id="glvl2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#E3EDC2"/></linearGradient><linearGradient id="glvl3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#DDD9D2"/></linearGradient></defs><rect x="1" y="1" width="1098" height="798" rx="22" fill="url(#gpaper)" stroke="#E7E3DD" stroke-width="2"/><rect x="1" y="1" width="1098" height="798" rx="22" fill="url(#gglow)"/><text x="44.0" y="56.0" font-size="27" fill="#0A0A0A" font-weight="600" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">Anatomy of a VSLA statement</text><rect x="44" y="66" width="64" height="3.5" rx="1.75" fill="url(#gaccent)"/><text x="44.0" y="92.0" font-size="14" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">An in-toto Statement v1 in a DSSE envelope over RFC 8785 canonical JSON. Digests go in; bodies stay out.</text><rect x="44.0" y="124.0" width="640.0" height="640.0" rx="18" fill="#0A0A0A" opacity="0.045"/><rect x="44.0" y="120.0" width="640.0" height="640.0" rx="18" fill="#0A0A0A" opacity="0.05"/><rect x="44.0" y="118.0" width="640.0" height="640.0" rx="18" fill="#fff" stroke="#3A3833" stroke-width="1.6"/><text x="64.0" y="146.0" font-size="12" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">_type: https://in-toto.io/Statement/v1</text><text x="64.0" y="164.0" font-size="12" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">predicateType: https://vsla.dev/provenance/v1</text><rect x="60.0" y="178.0" width="608.0" height="68.0" rx="12" fill="#F0EDEA" stroke="none" stroke-width="1.5"/><text x="74.0" y="202.0" font-size="14" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">subject</text><text x="74.0" y="222.0" font-size="11.5" fill="#3A3833" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">finding sha256:4c1f…  ·  git+…/example/vulnpkg @ 9b2e7c1d  ·  (patch: diff sha256:…)</text><text x="74.0" y="238.0" font-size="11" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">the report that describes the bug, bound to the exact commit it is about; a Patch statement adds the diff</text><rect x="60.0" y="260.0" width="608.0" height="62.0" rx="10" fill="#FAFFE0" stroke="#F2FFB8" stroke-width="1.2"/><rect x="70.0" y="270.0" width="29.0" height="22.0" rx="11.0" fill="#CFFF04" stroke="#CFFF04" stroke-width="1.2"/><text x="84.5" y="283.5" font-size="12" fill="#0A0A0A" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">L1</text><text x="114.0" y="284.0" font-size="13.5" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">finder · authorization</text><text x="114.0" y="301.0" font-size="10.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">identity ed25519:7a9c…  ·  operator quome.com  ·  harness qudisclose 0.2.0</text><text x="114.0" y="313.5" font-size="10.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">sha256:c41d…  ·  basis: program (SECURITY.md)</text><rect x="60.0" y="328.0" width="608.0" height="62.0" rx="10" fill="#FAFFE0" stroke="#F2FFB8" stroke-width="1.2"/><rect x="70.0" y="338.0" width="29.0" height="22.0" rx="11.0" fill="#CFFF04" stroke="#CFFF04" stroke-width="1.2"/><text x="84.5" y="351.5" font-size="12" fill="#0A0A0A" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">L1</text><text x="114.0" y="352.0" font-size="13.5" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">mbom</text><text x="114.0" y="369.0" font-size="10.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">hunter qwen3.8:27b q8 self-hosted, weights sha256:9f3a… + provider attestation (DSSE)</text><text x="114.0" y="381.5" font-size="10.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">·  reproducer claude-opus-5-5 api (unmeasurable)</text><rect x="60.0" y="396.0" width="608.0" height="62.0" rx="10" fill="#FAFFE0" stroke="#F2FFB8" stroke-width="1.2"/><rect x="70.0" y="406.0" width="29.0" height="22.0" rx="11.0" fill="#CFFF04" stroke="#CFFF04" stroke-width="1.2"/><text x="84.5" y="419.5" font-size="12" fill="#0A0A0A" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">L1</text><text x="114.0" y="420.0" font-size="13.5" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">transcript</text><text x="114.0" y="437.0" font-size="10.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">rfc6962-sha256 root 3e0b…  ·  7 leaves  ·  leaf 0 = measure(harness, sandbox)  ·</text><text x="114.0" y="449.5" font-size="10.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">verify leaf = the test run  ·  bodies sealed (HPKE)</text><rect x="60.0" y="464.0" width="608.0" height="62.0" rx="10" fill="#FAFFE0" stroke="#F2FFB8" stroke-width="1.2"/><rect x="70.0" y="474.0" width="29.0" height="22.0" rx="11.0" fill="#CFFF04" stroke="#CFFF04" stroke-width="1.2"/><text x="84.5" y="487.5" font-size="12" fill="#0A0A0A" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">L1</text><text x="114.0" y="488.0" font-size="13.5" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">reproduction</text><text x="114.0" y="505.0" font-size="10.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">test sha256:…  ·  command or commandDigest (embargoed)  ·  exit 1  ·  securityFailure</text><text x="114.0" y="517.5" font-size="10.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">per the classifier  ·  revision 9b2e…  ·  sandbox vm 5e1a…</text><rect x="60.0" y="532.0" width="608.0" height="62.0" rx="10" fill="#F1F6DF" stroke="#E3EDC2" stroke-width="1.2"/><rect x="70.0" y="542.0" width="29.0" height="22.0" rx="11.0" fill="#566B00" stroke="#566B00" stroke-width="1.2"/><text x="84.5" y="555.5" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">L2</text><text x="114.0" y="556.0" font-size="13.5" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">channel</text><text x="114.0" y="573.0" font-size="10.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">intake https://cvd.example.org/mcp  ·  intakeKey ed25519:…  ·  declaredIn SECURITY.md</text><text x="114.0" y="585.5" font-size="10.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">(the platform's answer is the separate receipt)</text><rect x="60.0" y="600.0" width="608.0" height="62.0" rx="10" fill="#F1F6DF" stroke="#E3EDC2" stroke-width="1.2"/><rect x="70.0" y="610.0" width="29.0" height="22.0" rx="11.0" fill="#566B00" stroke="#566B00" stroke-width="1.2"/><text x="84.5" y="623.5" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">L2</text><text x="114.0" y="624.0" font-size="13.5" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">history</text><text x="114.0" y="641.0" font-size="10.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ledger URL  ·  root 91d4…  ·  a summary only: the countersigned entries are what a</text><text x="114.0" y="653.5" font-size="10.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">verifier checks, never these numbers</text><rect x="60.0" y="668.0" width="608.0" height="62.0" rx="10" fill="#EFEDE9" stroke="#DDD9D2" stroke-width="1.2"/><rect x="70.0" y="678.0" width="29.0" height="22.0" rx="11.0" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="1.2"/><text x="84.5" y="691.5" font-size="12" fill="#CFFF04" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">L3</text><text x="114.0" y="692.0" font-size="13.5" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">environment</text><text x="114.0" y="709.0" font-size="10.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">sev-snp | tdx | nitro | two-operator | signed-quote  ·  measurement on the allowlist</text><text x="114.0" y="721.5" font-size="10.2" fill="#3A3833" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">·  quote binds enclaveKey ‖ harness ‖ weights ‖ sandbox</text><rect x="60.0" y="738.0" width="608.0" height="46.0" rx="10" fill="#fff" stroke="#E7E3DD" stroke-width="1.2" stroke-dasharray="4 3"/><text x="74.0" y="757.0" font-size="12.5" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">profile</text><text x="136.0" y="757.0" font-size="10.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">published: test path, command and files touched in plaintext</text><text x="136.0" y="773.0" font-size="10.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">embargoed: those fields are digests, so the statement can be published while the case is open</text><text x="720.0" y="140.0" font-size="17" fill="#0A0A0A" font-weight="600" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">Who signs what</text><rect x="720.0" y="164.0" width="360.0" height="150.0" rx="14" fill="#0A0A0A" opacity="0.045"/><rect x="720.0" y="160.0" width="360.0" height="150.0" rx="14" fill="#0A0A0A" opacity="0.05"/><rect x="720.0" y="158.0" width="360.0" height="150.0" rx="14" fill="#fff" stroke="#CFFF04" stroke-width="2"/><rect x="734.0" y="172.0" width="29.0" height="22.0" rx="11.0" fill="#CFFF04" stroke="#CFFF04" stroke-width="1.2"/><text x="748.5" y="185.5" font-size="12" fill="#0A0A0A" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">L1</text><text x="776.0" y="188.0" font-size="14" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">finder key</text><text x="734.0" y="214.0" font-size="11.6" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">signatures[0] on the envelope: Ed25519 over</text><text x="734.0" y="229.5" font-size="11.6" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">PAE(payloadType, payload). Pinned out of band;</text><text x="734.0" y="245.0" font-size="11.6" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">proves the statement was not altered after the</text><text x="734.0" y="260.5" font-size="11.6" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">finder made it.</text><rect x="720.0" y="330.0" width="360.0" height="150.0" rx="14" fill="#0A0A0A" opacity="0.045"/><rect x="720.0" y="326.0" width="360.0" height="150.0" rx="14" fill="#0A0A0A" opacity="0.05"/><rect x="720.0" y="324.0" width="360.0" height="150.0" rx="14" fill="#fff" stroke="#566B00" stroke-width="2"/><rect x="734.0" y="338.0" width="29.0" height="22.0" rx="11.0" fill="#566B00" stroke="#566B00" stroke-width="1.2"/><text x="748.5" y="351.5" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">L2</text><text x="776.0" y="354.0" font-size="14" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">platform receipt</text><text x="734.0" y="380.0" font-size="11.6" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">a separate DSSE object with its own payload type:</text><text x="734.0" y="395.5" font-size="11.6" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">{statement digest, channel, receivedAt, re-</text><text x="734.0" y="411.0" font-size="11.6" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">execution result, review, scope, anchor}. The</text><text x="734.0" y="426.5" font-size="11.6" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">finder's bytes are never touched; the platform</text><text x="734.0" y="442.0" font-size="11.6" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">signs what it saw when it ran the test itself.</text><rect x="720.0" y="496.0" width="360.0" height="150.0" rx="14" fill="#0A0A0A" opacity="0.045"/><rect x="720.0" y="492.0" width="360.0" height="150.0" rx="14" fill="#0A0A0A" opacity="0.05"/><rect x="720.0" y="490.0" width="360.0" height="150.0" rx="14" fill="#fff" stroke="#0A0A0A" stroke-width="2"/><rect x="734.0" y="504.0" width="29.0" height="22.0" rx="11.0" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="1.2"/><text x="748.5" y="517.5" font-size="12" fill="#CFFF04" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">L3</text><text x="776.0" y="520.0" font-size="14" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">enclave co-signature</text><text x="734.0" y="546.0" font-size="11.6" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">a second envelope signature under</text><text x="734.0" y="561.5" font-size="11.6" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">environment.enclaveKey. The verifier takes that</text><text x="734.0" y="577.0" font-size="11.6" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">key from the verified quote and nowhere else; if</text><text x="734.0" y="592.5" font-size="11.6" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">the quote fails, this signature counts for</text><text x="734.0" y="608.0" font-size="11.6" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">nothing.</text><text x="720.0" y="686.0" font-size="12" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">Every signed object (statement, receipt,</text><text x="720.0" y="702.0" font-size="12" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">ledger entry, weight attestation) is a DSSE</text><text x="720.0" y="718.0" font-size="12" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">envelope with its own payload type, so no</text><text x="720.0" y="734.0" font-size="12" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">signature can be replayed as another kind.</text></svg>
