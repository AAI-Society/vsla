<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 760" width="1040" height="760" role="img" aria-label="Anatomy of the VSLA receipt as a separate DSSE object, listing its fields, next to four notes on why it is separate" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#0A0A0A"><title>The platform receipt</title><defs><linearGradient id="gv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3A3833"/><stop offset="1" stop-color="#0A0A0A"/></linearGradient><linearGradient id="gt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7A9900"/><stop offset="1" stop-color="#566B00"/></linearGradient><linearGradient id="gaccent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#CFFF04"/><stop offset="1" stop-color="#CFFF04"/></linearGradient><linearGradient id="gpaper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#FBFAF7"/></linearGradient><radialGradient id="gglow" cx="0.08" cy="0" r="0.9"><stop offset="0" stop-color="#F0EDEA" stop-opacity="0.9"/><stop offset="0.45" stop-color="#F0EDEA" stop-opacity="0"/></radialGradient><linearGradient id="glvl0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#EEEBE6"/></linearGradient><linearGradient id="glvl1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#F2FFB8"/></linearGradient><linearGradient id="glvl2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#E3EDC2"/></linearGradient><linearGradient id="glvl3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#DDD9D2"/></linearGradient></defs><rect x="1" y="1" width="1038" height="758" rx="22" fill="url(#gpaper)" stroke="#E7E3DD" stroke-width="2"/><rect x="1" y="1" width="1038" height="758" rx="22" fill="url(#gglow)"/><text x="44.0" y="56.0" font-size="27" fill="#0A0A0A" font-weight="600" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">The platform receipt</text><rect x="44" y="66" width="64" height="3.5" rx="1.75" fill="url(#gaccent)"/><text x="44.0" y="92.0" font-size="14" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">A separate DSSE object with its own payload type, signed by the platform key, issued once per case. The finder's envelope is never modified.</text><rect x="44.0" y="130.0" width="560.0" height="562.0" rx="18" fill="#0A0A0A" opacity="0.045"/><rect x="44.0" y="126.0" width="560.0" height="562.0" rx="18" fill="#0A0A0A" opacity="0.05"/><rect x="44.0" y="124.0" width="560.0" height="562.0" rx="18" fill="#fff" stroke="#7A9900" stroke-width="2"/><text x="64.0" y="152.0" font-size="12" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">payloadType: application/vnd.vsla.receipt+json</text><text x="64.0" y="170.0" font-size="12" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">signatures[0].keyid: platform:cvd.example.org</text><rect x="60" y="188" width="4" height="34" rx="2" fill="#7A9900"/><text x="74.0" y="201.0" font-size="11.5" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">statementDigest</text><text x="74.0" y="215.0" font-size="9.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">sha256 of the finder's payload bytes: this receipt is about exactly that statement</text><rect x="60" y="235" width="4" height="34" rx="2" fill="#7A9900"/><text x="74.0" y="248.0" font-size="11.5" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">channel · receivedAt</text><text x="74.0" y="262.0" font-size="9.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">the intake URL the statement named, and the platform's clock: startedAt ≤ finishedAt ≤</text><text x="74.0" y="273.5" font-size="9.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">receivedAt ≤ integratedTime ≤ now</text><rect x="60" y="282" width="4" height="34" rx="2" fill="#0A0A0A"/><text x="74.0" y="295.0" font-size="11.5" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">reexecution.status</text><text x="74.0" y="309.0" font-size="9.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">matched · mismatched · environment-error · timeout · not-attempted (admission control</text><text x="74.0" y="320.5" font-size="9.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">deferred it)</text><rect x="60" y="329" width="4" height="34" rx="2" fill="#0A0A0A"/><text x="74.0" y="342.0" font-size="11.5" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">reexecution.revision</text><text x="74.0" y="356.0" font-size="9.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">the subject commit the platform checked out; a revision it cannot resolve is environment-</text><text x="74.0" y="367.5" font-size="9.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">error</text><rect x="60" y="376" width="4" height="34" rx="2" fill="#0A0A0A"/><text x="74.0" y="389.0" font-size="11.5" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">reexecution.classifier</text><text x="74.0" y="403.0" font-size="9.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">securityFailure by the platform's own rule (assertion in a collected test, no collection /</text><text x="74.0" y="414.5" font-size="9.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">import / timeout error)</text><rect x="60" y="423" width="4" height="34" rx="2" fill="#0A0A0A"/><text x="74.0" y="436.0" font-size="11.5" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">reexecution.touchedSubject</text><text x="74.0" y="450.0" font-size="9.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">the re-executed test imported or covered the subject package the platform's own config names</text><rect x="60" y="470" width="4" height="34" rx="2" fill="#0A0A0A"/><text x="74.0" y="483.0" font-size="11.5" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">reexecution.sandbox</text><text x="74.0" y="497.0" font-size="9.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">backend, isolation class (vm · container · process) and image digest; a production intake</text><text x="74.0" y="508.5" font-size="9.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">says vm</text><rect x="60" y="517" width="4" height="34" rx="2" fill="#0A0A0A"/><text x="74.0" y="530.0" font-size="11.5" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">patch: review · scope</text><text x="74.0" y="544.0" font-size="9.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">the platform's own review: approved, reviewerFamily, distinctFamily; scope computed from the</text><text x="74.0" y="555.5" font-size="9.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">diff (source-only · mixed)</text><rect x="60" y="564" width="4" height="34" rx="2" fill="#D9A400"/><text x="74.0" y="577.0" font-size="11.5" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">anchor · log-inclusion</text><text x="74.0" y="591.0" font-size="9.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">a signed checkpoint {log, treeSize, rootHash, integratedTime} and an RFC 6962 inclusion</text><text x="74.0" y="602.5" font-size="9.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">proof for this receipt body: append-only, auditable; what require_anchor accepts</text><rect x="60" y="611" width="4" height="34" rx="2" fill="#D9A400"/><text x="74.0" y="624.0" font-size="11.5" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">anchor · signed-timestamp</text><text x="74.0" y="638.0" font-size="9.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">a pinned log key's signature over the receipt digest and a time: proves the receipt existed</text><text x="74.0" y="649.5" font-size="9.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">by then on that key's word, nothing about append-only-ness; accepted only if the policy opts</text><text x="74.0" y="661.0" font-size="9.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">in</text><text x="640.0" y="146.0" font-size="17" fill="#0A0A0A" font-weight="600" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">Why a separate object</text><circle cx="646" cy="170" r="5" fill="#7A9900"/><text x="662.0" y="174.0" font-size="11.6" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">The finder's payload is signed once and</text><text x="662.0" y="189.5" font-size="11.6" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">never touched; a third signature on the</text><text x="662.0" y="205.0" font-size="11.6" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">envelope would mean re-serialising it.</text><circle cx="646" cy="288" r="5" fill="#0A0A0A"/><text x="662.0" y="292.0" font-size="11.6" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">E7 and E8 read the re-execution block only</text><text x="662.0" y="307.5" font-size="11.6" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">after I3 has verified the receipt under the</text><text x="662.0" y="323.0" font-size="11.6" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">pinned platform key named in</text><text x="662.0" y="338.5" font-size="11.6" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">channel.intakeKey, and not at all when the</text><text x="662.0" y="354.0" font-size="11.6" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">policy requires an anchor and none verifies.</text><circle cx="646" cy="406" r="5" fill="#D9A400"/><text x="662.0" y="410.0" font-size="11.6" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">One evaluation instant, t_eval: the anchor's</text><text x="662.0" y="425.5" font-size="11.6" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">integratedTime, else receivedAt, else the</text><text x="662.0" y="441.0" font-size="11.6" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">verifier's clock. Every key window, every</text><text x="662.0" y="456.5" font-size="11.6" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">revoke entry and the rubric's decay are</text><text x="662.0" y="472.0" font-size="11.6" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">evaluated there, so the result does not</text><text x="662.0" y="487.5" font-size="11.6" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">depend on when it is verified.</text><circle cx="646" cy="524" r="5" fill="#3A3833"/><text x="662.0" y="528.0" font-size="11.6" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">A negative receipt (mismatched, not-</text><text x="662.0" y="543.5" font-size="11.6" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">attempted) is what a finder disputes;</text><text x="662.0" y="559.0" font-size="11.6" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">silence is not an outcome. A verifier</text><text x="662.0" y="574.5" font-size="11.6" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">elsewhere needs only the statement, the</text><text x="662.0" y="590.0" font-size="11.6" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">receipt and its pinned keys.</text><text x="520.0" y="738.0" font-size="12.5" fill="#6F6A62" font-weight="400" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">A timestamp bounds receivedAt from above on one key's word; only log inclusion is append-only and lets another platform find the receipt.</text></svg>
