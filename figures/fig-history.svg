er, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" letter-spacing="1.6">FLOORS (HARD GATES)</text><text x="758.0" y="428.0" font-size="10.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">score</text><text x="978.0" y="428.0" font-size="10.5" fill="#566B00" font-weight="700" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">≥ 0.60</text><text x="758.0" y="444.0" font-size="10.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">counted entries</text><text x="978.0" y="444.0" font-size="10.5" fill="#566B00" font-weight="700" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">≥ 5</text><text x="758.0" y="460.0" font-size="10.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">pinned countersigners</text><text x="978.0" y="460.0" font-size="10.5" fill="#566B00" font-weight="700" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">≥ 2</text><text x="758.0" y="476.0" font-size="10.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">age of oldest</text><text x="978.0" y="476.0" font-size="10.5" fill="#566B00" font-weight="700" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">≥ 30 d</text></svg>
