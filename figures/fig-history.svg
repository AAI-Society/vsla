"11.5" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">accepted (counted)</text><circle cx="407" cy="318" r="7" fill="#D43F45"/><text x="420.0" y="322.0" font-size="11.5" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">rejected (counted; decays over 30 days)</text><circle cx="87" cy="342" r="7" fill="#fff" stroke="#C9C4BB" stroke-width="2" stroke-dasharray="3 2"/><text x="100.0" y="346.0" font-size="11.5" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">duplicate / withdrawn (neutral: excluded)</text><circle cx="407" cy="342" r="7" fill="#fff" stroke="#6F6A62" stroke-width="2"/><path d="M404 339l6 6M410 339l-6 6" stroke="#6F6A62" stroke-width="1.6"/><text x="420.0" y="346.0" font-size="11.5" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">unpinned countersigner (dropped)</text><text x="80.0" y="378.0" font-size="10.5" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">P = platform:cvd.example.org   M1, M2 = pinned maintainers   X = a key this reader did not pin</text><text x="80.0" y="400.0" font-size="11.2" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">Each entry is a DSSE envelope {kind, at, finder key, statement digest, platform, track, outcome, claimed, verified, reason?} whose</text><text x="80.0" y="415.0" font-size="11.2" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">leaf bytes are the envelope itself, so the root commits to the countersignature. The finder's operator owns the order; no entry</text><text x="80.0" y="430.0" font-size="11.2" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">carries an index. An outcome counts only if its finder is this key (or a predecessor named by a successor entry) and its track</text><text x="80.0" y="445.0" font-size="11.2" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">is this statement's track. successor and revoke entries are lifecycle entries, not outcomes: they rotate a key or end it.</text><rect x="740.0" y="128.0" width="256.0" height="358.0" rx="16" fill="#F0EDEA" stroke="none" stroke-width="1.5"/><text x="758.0" y="154.0" font-size="10.5" fill="#6F6A62" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" letter-spacing="1.6">TRUST SCORE · RUBRIC V1.1</text><text x="758.0" y="202.0" font-size="44" fill="#566B00" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">0.865</text><rect x="758.0" y="218.0" width="220.0" height="10.0" rx="5" fill="#fff" stroke="none" stroke-width="1.5"/><rect x="758.0" y="218.0" width="190.3" height="10.0" rx="5" fill="url(#gt)" stroke="none" stroke-width="1.5"/><path d="M890.0 212.0L890.0 234.0" stroke="#D43F45" stroke-width="2" stroke-linecap="round"/><text x="890.0" y="248.0" font-size="10.5" fill="#D43F45" font-weight="600" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">L2 floor 0.60</text><text x="758.0" y="278.0" font-size="11.5" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">P precision</text><text x="97