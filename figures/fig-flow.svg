 stroke-linejoin="round" opacity="0.45"/><path d="M50 74l6 6l12-13" fill="none" stroke="#CFFF04" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1000.0" y="272.0" font-size="17" fill="#0A0A0A" font-weight="600" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">Maintainer</text><text x="1000.0" y="292.0" font-size="11" fill="#6F6A62" font-weight="400" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">or their operator agent</text><path d="M232.0 176.0L448.0 176.0" stroke="#0A0A0A" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arr0A0A0A)"/><rect x="246.0" y="128.0" width="190.0" height="40.0" rx="8" fill="#F2FFB8" stroke="none" stroke-width="1.5"/><text x="341.0" y="145.0" font-size="12" fill="#0A0A0A" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">report + VSLA statement</text><text x="341.0" y="160.0" font-size="10.5" fill="#6F6A62" font-weight="400" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">claimed level · signed envelope · ledger</text><path d="M672.0 176.0L888.0 176.0" stroke="#7A9900" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arr7A9900)"/><rect x="686.0" y="128.0" width="190.0" height="40.0" rx="8" fill="#E3EDC2" stroke="none" stroke-width="1.5"/><text x="781.0" y="145.0" font-size="12" fill="#0A0A0A" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">case + verified level</text><text x="781.0" y="160.0" font-size="10.5" fill="#6F6A62" font-weight="400" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">PR · advisory · statement · receipt</text><path d="M888.0 232.0L672.0 232.0" stroke="#3A3833" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#arr3A3833)"/><text x="781.0" y="250.0" font-size="10.5" fill="#3A3833" font-weight="400" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">outcome: accepted · duplicate · rejected · retracted</text><path d="M448.0 232.0L232.0 232.0" stroke="#3A3833" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#arr3A3833)"/><text x="341.0" y="250.0" font-size="10.5" fill="#3A3833" font-weight="400" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">DSSE receipt, then a countersigned ledger entry</text><rect x="44.0" y="346.0" width="760.0" height="250.0" rx="16" fill="#F0EDEA" stroke="none" stroke-width="1.5"/><text x="64.0" y="378.0" font-size="16" fill="#0A0A0A" font-weight="600" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">What the platform verifies before it believes a level</text><rect x="64.0" y="399.0" width="27.3" height="20.5" rx="10.25" fill="#CFFF04" stroke="#CFFF04" stroke-width="1.2"/><text x="77.7" y="411.0" font-size="10.5" fill="#0A0A0A" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">L1</text><rect x="102.0" y="401.0" width="27.4" height="19.5" rx="9.75" fill="#fff" stroke="#566B00" stroke-width="1.2"/><text x="115.7" y="412.0" font-size="9.5" fill="#566B00" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">EXT</text><text x="146.0" y="413.0" font-size="12.5" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">signature, subject</text><text x="322.0" y="413.0" font-size="10.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">DSSE signature under a pinned finder key; subject[0] equals the report digest; revision bound</text><rect x="64.0" y="435.0" width="27.3" height="20.5" rx="10.25" fill="#CFFF04" stroke="#CFFF04" stroke-width="1.2"/><text x="77.7" y="447.0" font-size="10.5" fill="#0A0A0A" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">L1</text><rect x="102.0" y="437.0" width="27.4" height="19.5" rx="9.75" fill="#fff" stroke="#6F6A62" stroke-width="1.2"/><text x="115.7" y="448.0" font-size="9.5" fill="#6F6A62" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">STR</text><text x="146.0" y="449.0" font-size="12.5" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">transcript, reproduction</text><text x="322.0" y="449.0" font-size="10.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">root recomputed from the leaves; leaf 0 measures; the verify leaf agrees with the reproduction section</text><rect x="64.0" y="471.0" width="27.3" height="20.5" rx="10.25" fill="#566B00" stroke="#566B00" stroke-width="1.2"/><text x="77.7" y="483.0" font-size="10.5" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">L2</text><rect x="102.0" y="473.0" width="27.4" height="19.5" rx="9.75" fill="#fff" stroke="#566B00" stroke-width="1.2"/><text x="115.7" y="484.0" font-size="9.5" fill="#566B00" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">EXT</text><text x="146.0" y="485.0" font-size="12.5" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">re-execution</text><text x="322.0" y="485.0" font-size="10.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">its own sandbox at the subject revision; its own classifier; the test imported the subject package</text><rect x="64.0" y="507.0" width="27.3" height="20.5" rx="10.25" fill="#566B00" stroke="#566B00" stroke-width="1.2"/><text x="77.7" y="519.0" font-size="10.5" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">L2</text><rect x="102.0" y="509.0" width="27.4" height="19.5" rx="9.75" fill="#fff" stroke="#566B00" stroke-width="1.2"/><text x="115.7" y="520.0" font-size="9.5" fill="#566B00" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">EXT</text><text x="146.0" y="521.0" font-size="12.5" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">receipt, ledger</text><text x="322.0" y="521.0" font-size="10.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">its own platform key; full ledger, pinned countersigners, bound to finder and track, consistent</text><rect x="64.0" y="543.0" width="27.3" height="20.5" rx="10.25" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="1.2"/><text x="77.7" y="555.0" font-size="10.5" fill="#CFFF04" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">L3</text><rect x="102.0" y="545.0" width="27.4" height="19.5" rx="9.75" fill="#fff" stroke="#566B00" stroke-width="1.2"/><text x="115.7" y="556.0" font-size="9.5" fill="#566B00" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">EXT</text><text x="146.0" y="557.0" font-size="12.5" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">environment</text><text x="322.0" y="557.0" font-size="10.8" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">quote verifies under the pinned root; bindings match; measurement allowlisted; no api-served model</text><rect x="828.0" y="382.0" width="248.0" height="150.0" rx="14" fill="#0A0A0A" opacity="0.045"/><rect x="828.0" y="378.0" width="248.0" height="150.0" rx="14" fill="#0A0A0A" opacity="0.05"/><rect x="828.0" y="376.0" width="248.0" height="150.0" rx="14" fill="#fff" stroke="#E7E3DD" stroke-width="1.5"/><text x="848.0" y="404.0" font-size="12" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">claimed</text><rect x="930.0" y="388.0" width="29.0" height="22.0" rx="11.0" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="1.2"/><text x="944.5" y="401.5" font-size="12" fill="#CFFF04" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">L3</text><path d="M960.0 416.0L960.0 438.0" stroke="#3A3833" stroke-width="1.8" fill="none" stroke-linecap="round" marker-end="url(#arr3A3833)"/><text x="848.0" y="464.0" font-size="12" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">verified</text><rect x="930.0" y="448.0" width="29.0" height="22.0" rx="11.0" fill="#CFFF04" stroke="#CFFF04" stroke-width="1.2"/><text x="944.5" y="461.5" font-size="12" fill="#0A0A0A" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">L1</text><text x="848.0" y="488.0" font-size="10.5" fill="#D43F45" font-weight="600" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">no ledger · no expectation → L1</text><text x="560.0" y="658.0" font-size="12.5" fill="#6F6A62" font-weight="400" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">Both parties keep a signed audit chain; a dispute about who knew what, when, rests on the receipt and on the log that includes it.</text></svg>
