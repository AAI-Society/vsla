adient id="glvl2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#E3EDC2"/></linearGradient><linearGradient id="glvl3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#DDD9D2"/></linearGradient></defs><rect x="1" y="1" width="1118" height="678" rx="22" fill="url(#gpaper)" stroke="#E7E3DD" stroke-width="2"/><rect x="1" y="1" width="1118" height="678" rx="22" fill="url(#gglow)"/><text x="44.0" y="56.0" font-size="27" fill="#0A0A0A" font-weight="600" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">Machine-to-machine disclosure with VSLA</text><rect x="44" y="66" width="64" height="3.5" rx="1.75" fill="url(#gaccent)"/><text x="44.0" y="92.0" font-size="14" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">The finder claims a level; the platform verifies one and signs a receipt; the maintainer's outcome is countersigned into the finder's ledger.</text><rect x="10.0" y="124.0" width="220.0" height="196.0" rx="18" fill="#0A0A0A" opacity="0.045"/><rect x="10.0" y="120.0" width="220.0" height="196.0" rx="18" fill="#0A0A0A" opacity="0.05"/><rect x="10.0" y="118.0" width="220.0" height="196.0" rx="18" fill="#fff" stroke="#E7E3DD" stroke-width="1.5"/><g transform="translate(66 126) scale(0.9)"><rect x="12" y="12" width="96" height="96" rx="22" fill="#0A0A0A"/><circle cx="54" cy="54" r="19" fill="none" stroke="#CFFF04" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M68 68L84 84" fill="none" stroke="#CFFF04" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="120.0" y="272.0" font-size="17" fill="#0A0A0A" font-weight="600" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">Finder agent</text><text x="120.0" y="292.0" font-