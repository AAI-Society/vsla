<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700" width="1080" height="700" role="img" aria-label="A three-by-three matrix of VSLA pillars against levels" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#0A0A0A"><title>Three pillars, three levels</title><defs><linearGradient id="gv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3A3833"/><stop offset="1" stop-color="#0A0A0A"/></linearGradient><linearGradient id="gt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7A9900"/><stop offset="1" stop-color="#566B00"/></linearGradient><linearGradient id="gaccent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#CFFF04"/><stop offset="1" stop-color="#CFFF04"/></linearGradient><linearGradient id="gpaper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#FBFAF7"/></linearGradient><radialGradient id="gglow" cx="0.08" cy="0" r="0.9"><stop offset="0" stop-color="#F0EDEA" stop-opacity="0.9"/><stop offset="0.45" stop-color="#F0EDEA" stop-opacity="0"/></radialGradient><linearGradient id="glvl0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#EEEBE6"/></linearGradient><linearGradient id="glvl1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#F2FFB8"/></linearGradient><linearGradient id="glvl2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#E3EDC2"/></linearGradient><linearGradient id="glvl3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#DDD9D2"/></linearGradient></defs><rect x="1" y="1" width="1078" height="698" rx="22" fill="url(#gpaper)" stroke="#E7E3DD" stroke-width="2"/><rect x="1" y="1" width="1078" height="698" rx="22" fill="url(#gglow)"/><text x="44.0" y="56.0" font-size="27" fill="#0A0A0A" font-weight="600" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">Three pillars, three levels</text><rect x="44" y="66" width="64" height="3.5" rx="1.75" fill="url(#gaccent)"/><text x="44.0" y="92.0" font-size="14" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">Every disclosure is asked three questions. A level is granted only when all three pillars meet it; the weakest pillar sets the level.</text><rect x="268.0" y="126.0" width="250.0" height="36.0" rx="10" fill="#CFFF04" stroke="none" stroke-width="1.5"/><text x="393.0" y="150.0" font-size="15" fill="#0A0A0A" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">L1 · Attested</text><rect x="530.0" y="126.0" width="250.0" height="36.0" rx="10" fill="#566B00" stroke="none" stroke-width="1.5"/><text x="655.0" y="150.0" font-size="15" fill="#fff" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">L2 · Trusted</text><rect x="792.0" y="126.0" width="250.0" height="36.0" rx="10" fill="#0A0A0A" stroke="none" stroke-width="1.5"/><text x="917.0" y="150.0" font-size="15" fill="#fff" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">L3 · Hardened</text><text x="44.0" y="214.0" font-size="19" fill="#0A0A0A" font-weight="600" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">Evidence</text><text x="44.0" y="236.0" font-size="11.5" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">Is the bug real, and</text><text x="44.0" y="251.0" font-size="11.5" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">would it be real for</text><text x="44.0" y="266.0" font-size="11.5" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">anyone who looked?</text><rect x="268.0" y="174.0" width="250.0" height="150.0" rx="12" fill="#FAFFE0" stroke="#F2FFB8" stroke-width="1.5"/><text x="282.0" y="196.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">A test executed by code fails by</text><text x="282.0" y="211.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">assertion at the subject revision;</text><text x="282.0" y="226.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">Merkle-rooted transcript with measure</text><text x="282.0" y="241.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">and verify leaves; an MBOM naming</text><text x="282.0" y="256.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">every model. Proves reproducibility,</text><text x="282.0" y="271.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">not validity.</text><rect x="530.0" y="174.0" width="250.0" height="150.0" rx="12" fill="#F1F6DF" stroke="#E3EDC2" stroke-width="1.5"/><text x="544.0" y="196.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">The receiving platform re-executes in</text><text x="544.0" y="211.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">its own isolated sandbox at the</text><text x="544.0" y="226.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">subject revision, with its own</text><text x="544.0" y="241.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">classifier and a coverage check; on</text><text x="544.0" y="256.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">patches, its own review on a different</text><text x="544.0" y="271.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">model family and a source-only scope.</text><rect x="792.0" y="174.0" width="250.0" height="150.0" rx="12" fill="#EFEDE9" stroke="#DDD9D2" stroke-width="1.5"/><text x="806.0" y="196.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">Nothing new: the environment, not the</text><text x="806.0" y="211.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">evidence, is what L3 adds. The</text><text x="806.0" y="226.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">reproduction sandbox is bound into the</text><text x="806.0" y="241.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">quote.</text><text x="44.0" y="376.0" font-size="19" fill="#0A0A0A" font-weight="600" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">Identity</text><text x="44.0" y="398.0" font-size="11.5" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">Who says so, and what is</text><text x="44.0" y="413.0" font-size="11.5" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">their record?</text><rect x="268.0" y="336.0" width="250.0" height="150.0" rx="12" fill="#FAFFE0" stroke="#F2FFB8" stroke-width="1.5"/><text x="282.0" y="358.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">A stable Ed25519 key per finder, an</text><text x="282.0" y="373.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">accountable operator, an authorization</text><text x="282.0" y="388.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">basis; keys have validity windows and</text><text x="282.0" y="403.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">can be revoked.</text><rect x="530.0" y="336.0" width="250.0" height="150.0" rx="12" fill="#F1F6DF" stroke="#E3EDC2" stroke-width="1.5"/><text x="544.0" y="358.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">Authoritative channel; a signed</text><text x="544.0" y="373.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">receipt from a pinned platform; the</text><text x="544.0" y="388.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">full ledger supplied,</text><text x="544.0" y="403.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">countersignatures verified against</text><text x="544.0" y="418.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">pinned keys, bound to this finder and</text><text x="544.0" y="433.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">track, consistent with the last root</text><text x="544.0" y="448.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">seen; score, breadth and age meet the</text><text x="544.0" y="463.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">floors.</text><rect x="792.0" y="336.0" width="250.0" height="150.0" rx="12" fill="#EFEDE9" stroke="#DDD9D2" stroke-width="1.5"/><text x="806.0" y="358.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">The enclave co-signature verifies</text><text x="806.0" y="373.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">under the key the verified quote</text><text x="806.0" y="388.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">binds; never a pinned key.</text><text x="44.0" y="538.0" font-size="19" fill="#0A0A0A" font-weight="600" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">Environment</text><text x="44.0" y="560.0" font-size="11.5" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">Could anyone, including</text><text x="44.0" y="575.0" font-size="11.5" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">the operator, have</text><text x="44.0" y="590.0" font-size="11.5" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">tampered with the</text><text x="44.0" y="605.0" font-size="11.5" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">finder?</text><rect x="268.0" y="498.0" width="250.0" height="150.0" rx="12" fill="#FAFFE0" stroke="#F2FFB8" stroke-width="1.5"/><text x="282.0" y="520.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">Serving mode declared for every model</text><text x="282.0" y="535.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">(api, self-hosted, tee); weights carry</text><text x="282.0" y="550.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">a digest of the loaded bytes or say</text><text x="282.0" y="565.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">unmeasured. Trust equals declaration.</text><rect x="530.0" y="498.0" width="250.0" height="150.0" rx="12" fill="#F1F6DF" stroke="#E3EDC2" stroke-width="1.5"/><text x="544.0" y="520.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">Measured harness and sandbox digests</text><text x="544.0" y="535.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">in leaf 0 equal the receiver's own</text><text x="544.0" y="550.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">expectation for that version; provider</text><text x="544.0" y="565.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">weight attestations verify. External</text><text x="544.0" y="580.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">in form, copyable by a finder: it</text><text x="544.0" y="595.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">catches drift, not fraud.</text><rect x="792.0" y="498.0" width="250.0" height="150.0" rx="12" fill="#EFEDE9" stroke="#DDD9D2" stroke-width="1.5"/><text x="806.0" y="520.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">Weights, harness, policy and sandbox</text><text x="806.0" y="535.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">in a TEE or two-operator split; the</text><text x="806.0" y="550.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">quote binds them and the key; the</text><text x="806.0" y="565.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">(type, measurement, harness) triple is</text><text x="806.0" y="580.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">allowlisted. Any api-served model</text><text x="806.0" y="595.0" font-size="11.3" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">stops this pillar at L2.</text><text x="540.0" y="678.0" font-size="12.5" fill="#6F6A62" font-weight="400" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">The verified level is the minimum across the three pillars and the claim; each pillar reports the first check that failed.</text></svg>
