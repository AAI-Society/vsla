<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" width="1040" height="600" role="img" aria-label="Two columns comparing the finder's own executed test at L1 with the receiver's re-execution at L2, over a strip listing what neither proves" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#0A0A0A"><title>Evidence at L1 and L2</title><defs><marker id="arr3A3833" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3A3833"/></marker><linearGradient id="gv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3A3833"/><stop offset="1" stop-color="#0A0A0A"/></linearGradient><linearGradient id="gt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7A9900"/><stop offset="1" stop-color="#566B00"/></linearGradient><linearGradient id="gaccent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#CFFF04"/><stop offset="1" stop-color="#CFFF04"/></linearGradient><linearGradient id="gpaper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#FBFAF7"/></linearGradient><radialGradient id="gglow" cx="0.08" cy="0" r="0.9"><stop offset="0" stop-color="#F0EDEA" stop-opacity="0.9"/><stop offset="0.45" stop-color="#F0EDEA" stop-opacity="0"/></radialGradient><linearGradient id="glvl0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#EEEBE6"/></linearGradient><linearGradient id="glvl1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#F2FFB8"/></linearGradient><linearGradient id="glvl2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#E3EDC2"/></linearGradient><linearGradient id="glvl3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#DDD9D2"/></linearGradient></defs><rect x="1" y="1" width="1038" height="598" rx="22" fill="url(#gpaper)" stroke="#E7E3DD" stroke-width="2"/><rect x="1" y="1" width="1038" height="598" rx="22" fill="url(#gglow)"/><text x="44.0" y="56.0" font-size="27" fill="#0A0A0A" font-weight="600" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">What the Evidence pillar checks on the Finding track</text><rect x="44" y="66" width="64" height="3.5" rx="1.75" fill="url(#gaccent)"/><text x="44.0" y="92.0" font-size="14" fill="#6F6A62" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">L1 is the finder's own account, executed by code. L2 is someone else's execution. Neither is a proof that the bug is real.</text><rect x="44.0" y="134.0" width="476.0" height="300.0" rx="18" fill="#0A0A0A" opacity="0.045"/><rect x="44.0" y="130.0" width="476.0" height="300.0" rx="18" fill="#0A0A0A" opacity="0.05"/><rect x="44.0" y="128.0" width="476.0" height="300.0" rx="18" fill="url(#glvl1)" stroke="#CFFF04" stroke-width="2"/><rect x="64.0" y="146.0" width="30.0" height="23.0" rx="11.5" fill="#CFFF04" stroke="#CFFF04" stroke-width="1.2"/><text x="79.0" y="160.5" font-size="13" fill="#0A0A0A" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">L1</text><text x="114.0" y="163.0" font-size="17" fill="#0A0A0A" font-weight="600" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">the finder's account</text><circle cx="74" cy="196" r="7" fill="#566B00"/><path d="M70.2 196l2.8 2.8l5.2-5.6" stroke="#fff" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="92.0" y="200.0" font-size="12.5" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">code executed it</text><text x="92.0" y="216.0" font-size="10.5" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">a test runner produced the exit code; a model's claim that it ran</text><text x="92.0" y="229.0" font-size="10.5" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">does not count</text><circle cx="74" cy="254" r="7" fill="#566B00"/><path d="M70.2 254l2.8 2.8l5.2-5.6" stroke="#fff" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="92.0" y="258.0" font-size="12.5" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">fails by assertion</text><text x="92.0" y="274.0" font-size="10.5" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">classifier: at least one collected test failed by assertion; no</text><text x="92.0" y="287.0" font-size="10.5" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">collection, import, fixture or timeout error</text><circle cx="74" cy="312" r="7" fill="#566B00"/><path d="M70.2 312l2.8 2.8l5.2-5.6" stroke="#fff" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="92.0" y="316.0" font-size="12.5" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">at the subject revision</text><text x="92.0" y="332.0" font-size="10.5" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">reproduction.revision equals subject[1]; the verify leaf in the</text><text x="92.0" y="345.0" font-size="10.5" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">transcript agrees</text><circle cx="74" cy="370" r="7" fill="#566B00"/><path d="M70.2 370l2.8 2.8l5.2-5.6" stroke="#fff" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="92.0" y="374.0" font-size="12.5" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">bound and signed</text><text x="92.0" y="390.0" font-size="10.5" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">test digest, command (or its digest), output digest, start and</text><text x="92.0" y="403.0" font-size="10.5" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">end; finder signature under a pinned key</text><rect x="544.0" y="134.0" width="476.0" height="300.0" rx="18" fill="#0A0A0A" opacity="0.045"/><rect x="544.0" y="130.0" width="476.0" height="300.0" rx="18" fill="#0A0A0A" opacity="0.05"/><rect x="544.0" y="128.0" width="476.0" height="300.0" rx="18" fill="url(#glvl2)" stroke="#566B00" stroke-width="2"/><rect x="564.0" y="146.0" width="30.0" height="23.0" rx="11.5" fill="#566B00" stroke="#566B00" stroke-width="1.2"/><text x="579.0" y="160.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">L2</text><text x="614.0" y="163.0" font-size="17" fill="#0A0A0A" font-weight="600" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">the receiver's execution</text><circle cx="574" cy="196" r="7" fill="#566B00"/><path d="M570.2 196l2.8 2.8l5.2-5.6" stroke="#fff" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="592.0" y="200.0" font-size="12.5" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">re-executed</text><text x="592.0" y="216.0" font-size="10.5" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">the platform checks out the subject commit in its own isolated</text><text x="592.0" y="229.0" font-size="10.5" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">sandbox and runs the same command</text><circle cx="574" cy="254" r="7" fill="#566B00"/><path d="M570.2 254l2.8 2.8l5.2-5.6" stroke="#fff" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="592.0" y="258.0" font-size="12.5" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">its own classifier</text><text x="592.0" y="274.0" font-size="10.5" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">the platform's rule over the runner's structured result; the</text><text x="592.0" y="287.0" font-size="10.5" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">finder's flag is never copied</text><circle cx="574" cy="312" r="7" fill="#566B00"/><path d="M570.2 312l2.8 2.8l5.2-5.6" stroke="#fff" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="592.0" y="316.0" font-size="12.5" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">touched the subject</text><text x="592.0" y="332.0" font-size="10.5" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">the test imported or covered the package the platform's own repo</text><text x="592.0" y="345.0" font-size="10.5" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">config names, not a string the finder wrote</text><circle cx="574" cy="370" r="7" fill="#566B00"/><path d="M570.2 370l2.8 2.8l5.2-5.6" stroke="#fff" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="592.0" y="374.0" font-size="12.5" fill="#0A0A0A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">signed into a receipt</text><text x="592.0" y="390.0" font-size="10.5" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">status, revision, classifier result, coverage, isolation class; a</text><text x="592.0" y="403.0" font-size="10.5" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">third party verifies the receipt before trusting any of it</text><path d="M522.0 278.0L542.0 278.0" stroke="#3A3833" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arr3A3833)"/><rect x="44.0" y="452.0" width="952.0" height="92.0" rx="14" fill="#FFE3E4" stroke="none" stroke-width="1.5"/><text x="64.0" y="476.0" font-size="10.5" fill="#D43F45" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" letter-spacing="1.6">WHAT IT DOES NOT PROVE</text><text x="64.0" y="498.0" font-size="11" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">A finder can write a test that fails on demand, and `import subject; assert False` clears both the classifier and the coverage check. The classifier</text><text x="64.0" y="512.5" font-size="11" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">filters honest non-security failures; it is not sound against a hostile test, which can forge the runner's own report. The semantic judgement</text><text x="64.0" y="527.0" font-size="11" fill="#3A3833" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">(is this exploitable, is it the bug the report describes) is the receiver's, and a level is an input to triage ordering, never to review depth.</text><text x="520.0" y="578.0" font-size="12.5" fill="#6F6A62" font-weight="400" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">Differential reproduction (fails at the subject revision, passes at a reference) is the check that would speak to validity; v1.0 specifies it as optional.</text></svg>
